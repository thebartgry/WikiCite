<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WikiCite</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background:#0b0b0b; color:#f3f3f3; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 18px; }
    .card { background:#151515; border:1px solid #262626; border-radius: 14px; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 8px 0 14px; color:#cfcfcf; }
    label { display:block; font-size: 13px; color:#cfcfcf; margin: 10px 0 6px; }
    input, textarea, button {
      width: 100%; box-sizing: border-box; border-radius: 10px;
      border:1px solid #2b2b2b; background:#0f0f0f; color:#f3f3f3;
      padding: 12px; font-size: 16px;
    }
    textarea { min-height: 170px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .row { display:flex; gap:10px; flex-wrap: wrap; margin-top: 10px; }
    .row > * { flex: 1 1 180px; }
    button { cursor:pointer; background:#1f1f1f; }
    button:hover { background:#252525; }
    .small { font-size: 12px; color:#bdbdbd; margin-top: 10px; }
    .err { color: #ff9a9a; white-space: pre-wrap; margin-top: 8px; }
    .library-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid #2b2b2b;
  padding: 8px 0;
}

.library-title {
  color: #f3f3f3;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.library-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.library-actions button {
  width: auto;
  padding: 4px 8px;
  font-size: 16px;
  line-height: 1;
  border-radius: 6px;
}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>WikiCite_nl</h1>
      <p><code>Citeer journal</code> vanaf DOI, formatting simpel~</p>

      <label for="doi">DOI</label>
      <input id="doi" placeholder="e.g., 10.1038/s41586-020-2649-2" autocomplete="off" />

      <div class="row">
        <button id="go">Genereer citatie</button>
        <button id="copy" disabled>Kopieer code</button>
        <button id="save" disabled>Save citation</button>
        <button id="clear">Clear</button>
      </div>

      <div id="status" class="small"></div>
      <div id="error" class="err"></div>

      <textarea id="out" readonly placeholder="citatie verschijnt hier..."></textarea>
      <label>Saved citations</label>
<div id="library" class="small"></div>

      <div class="small">
        @thebartgry. Metadata van Crossref.
      </div>
    </div>
  </div>

<script>
  function normalizeDOI(raw) {
  if (!raw) return "";
  const s = String(raw).trim();

  // 1) If it's a DOI URL, strip the domain
  const urlStripped = s.replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "");

  // 2) Extract the first DOI-like pattern anywhere in the text
  // DOI format: starts with 10.<digits>/
  const m = urlStripped.match(/10\.\d{4,9}\/[^\s"'<>\]\)]+/i);
  if (!m) return "";

  // 3) Clean common trailing punctuation
  return m[0].replace(/[.,;:!?]+$/g, "");
}

  function pickFirst(v) {
    if (!v) return "";
    return Array.isArray(v) ? (v[0] || "") : v;
  }

  function yearFrom(msg) {
    const dateParts =
      (msg["published-print"] && msg["published-print"]["date-parts"]) ||
      (msg["published-online"] && msg["published-online"]["date-parts"]) ||
      (msg.created && msg.created["date-parts"]) ||
      null;

    if (dateParts && Array.isArray(dateParts) && Array.isArray(dateParts[0])) {
      return String(dateParts[0][0] ?? "");
    }
    return "";
  }

  function cleanWikiMarkup(text) {
  if (!text) return "";

  return String(text)
    // convert HTML italics to Wikipedia italics
    .replace(/<i>(.*?)<\/i>/gis, "''$1''")

    // remove line breaks/tabs from metadata
    .replace(/[\r\n\t]+/g, " ")

    // collapse repeated spaces
    .replace(/\s{2,}/g, " ")

    .trim();
}
  
function toNormalCase(name) {
  if (!name) return "";
  const lower = String(name).trim().toLocaleLowerCase();

  // Capitalize first letter of each token after: start, space, hyphen, apostrophe
  return lower.replace(/(^|[\s\-’'])(\p{L})/gu, (m, sep, ch) => sep + ch.toLocaleUpperCase());
}

  function normalizeTitle(title) {
  if (!title) return "";

  const s = String(title).trim();

  // Detect "mostly uppercase" titles
  const letters = s.replace(/[^\p{L}]/gu, "");
  if (!letters) return s;

  const upperRatio =
    letters.replace(/[^\p{Lu}]/gu, "").length / letters.length;

  // If ≥80% uppercase → convert to sentence case
  if (upperRatio >= 0.8) {
    const lower = s.toLocaleLowerCase();
    return lower.charAt(0).toLocaleUpperCase() + lower.slice(1);
  }

  return s;
}
  
  function joinAuthors(authors) {
  if (!Array.isArray(authors) || authors.length === 0) return "";

  const max = 7;
  const selected = authors.slice(0, max);

  const formatted = selected.map(a => {
    const family = toNormalCase((a.family || "").trim());
    const given = (a.given || "").trim();
    const initials = given
      ? given.split(/\s+/).map(x => x[0]).join("")
      : "";
    return `${family} ${initials}`.trim();
  });

  const hasEtAl = authors.length > max;
  const suffix = hasEtAl ? ", et al." : ".";

  return formatted.join(", ") + suffix;
}

  function refNameFromAuthors(authors, title) {
  if (!Array.isArray(authors) || authors.length === 0) return refNameFromTitle(title);

  const family = (authors[0].family || "").trim();
  if (!family) return refNameFromTitle(title);

  const base = family.split("-")[0]
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z]/g, "");

  // If surname is short enough, use surname logic; now up to 8 letters
  if (base.length <= 8) return base;

  // If surname is longer than 8 letters, use a meaningful title word
  return refNameFromTitle(title) || base.slice(0, 8);
}

  function refNameFromTitle(title) {
  if (!title) return "ref";

  const boringWords = new Set([
  // General English
  "the","and","for","with","from","into","onto","over","under","between",
  "through","within","among","across","using","based","toward","towards",
  "during","after","before","their","these","those","this","that",

  // Generic science-paper filler
  "study","studies","analysis","analyses","novel","new","role","roles",
  "effect","effects","evidence","insights","approach","approaches",
  "mechanism","mechanisms","function","functions","association",
  "associations","dynamics","pattern","patterns","response","responses",
  "interaction","interactions","system","systems","network","networks",
  "model","models","method","methods","overview","review","characterization",
  "identification","regulation","evaluation","comparison","comparative",
  "global","local","multiple","common","distinct","specific","potential",

  // Biology-general
  "biological","molecular","cellular","genetic","genomic","genomics",
  "transcriptomic","transcriptomics","proteomic","proteomics",
  "metabolic","metabolism","physiological","evolutionary","structural",
  "functional","environmental","ecological","organismal",

  // Taxonomy / phylogeny
  "phylogeny","phylogenetic","phylogenetics","evolution","evolutionary",
  "taxonomic","taxonomy","clade","lineage","lineages","species",
  "organism","organisms","plants","plant","fungi","fungal","animals",
  "animal","bacterial","bacteria","archaeal","archaea","microbial",
  "microbiome","eukaryotic","prokaryotic",

  // Molecular biology
  "expression","signaling","signalling","pathway","pathways",
  "biosynthesis","degradation","activation","inhibition","assembly",
  "synthesis","transport","localization","transcription","translation",
  "replication","mutation","mutations","domain","domains",

  // Biochemistry
  "enzyme","enzymes","protein","proteins","receptor","receptors",
  "substrate","substrates","binding","complex","complexes",
  "metabolite","metabolites","catalytic","biochemical",

  // Immunology
  "immune","immunity","inflammatory","inflammation","cytokine",
  "cytokines","macrophage","macrophages","lymphocyte","lymphocytes",
  "antigen","antigens","antibody","antibodies","tcell","bcell",
  "interferon","interleukin",

  // Ecology / environment
  "community","communities","adaptation","adaptations","diversity",
  "distribution","climate","habitat","ecosystem","ecosystems",

  // Common weak title words
  "high","low","major","minor","critical","important","essential",
  "associated","mediated","dependent","induced","reveals","revealed",
  "controls","promotes","required","underlies","links","linking"
]);

  const words = String(title)
    .replace(/''(.*?)''/g, "$1")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .match(/[a-z]{5,12}/g) || [];

  const candidate = words.find(w => !boringWords.has(w));

  return candidate ? candidate.slice(0, 8) : "ref";
}

function abbreviateJournal(journal) {
  if (!journal) return "";

  // One-word journals are usually kept as-is
  if (!journal.includes(" ")) return journal;

  const abbreviations = {
    "journal": "J.",
    "international": "Int.",
    "review": "Rev.",
    "reviews": "Rev.",
    "medicine": "Med.",
    "medical": "Med.",
    "biological": "Biol.",
    "biology": "Biol.",
    "experimental": "Exp.",
    "american": "Am.",
    "british": "Br.",
    "european": "Eur.",
    "national": "Natl.",
    "clinical": "Clin.",
    "research": "Res.",
    "science": "Sci.",
    "sciences": "Sci.",
    "proceedings": "Proc.",
    "immunology": "Immunol.",
    "microbiology": "Microbiol.",
    "virology": "Virol.",
    "pharmacology": "Pharmacol.",
    "chemistry": "Chem.",
    "ecology": "Ecol.",
    "genetics": "Genet.",
    "evolution": "Evol.",
    "molecular": "Mol.",
    "cellular": "Cell.",
    "environmental": "Environ."
  };

  const skipWords = new Set([
    "of", "the", "and", "for", "in", "on"
  ]);

  return journal
    .split(/\s+/)
    .filter(word => !skipWords.has(word.toLowerCase()))
    .map(word => {
      const clean = word.replace(/[.,:;()]/g, "");
      const lower = clean.toLowerCase();

      // Keep acronyms untouched
      if (/^[A-Z0-9]{2,}$/.test(clean)) {
        return clean;
      }

      // Use known abbreviation
      if (abbreviations[lower]) {
        return abbreviations[lower];
      }

      // Short words stay unchanged
      if (clean.length <= 6) {
        return clean;
      }

      // Generic fallback abbreviation
      return clean.slice(0, 5) + ".";
    })
    .join(" ");
}
  
  function toWikicodeCiteJournal(msg, doi) {
  const titel = cleanWikiMarkup(
  normalizeTitle(pickFirst(msg.title) || "") );
  const refName = refNameFromAuthors(msg.author, titel);
  const journal = pickFirst(msg["container-title"]) || "";
  const volume = msg.volume || "";
  const issue = msg.issue || "";
  const pages = msg.page || "";
  const jaar = yearFrom(msg);
  const auteur = joinAuthors(msg.author);
  const pmid = msg.PMID || "";
  const taal = msg.language || "en";

  const params = [
    ["auteur", auteur],
    ["jaar", jaar],
    ["titel", titel],
    ["journal", journal],
    ["volume", volume],
    ["issue", issue],
    ["pages", pages],
    ["doi", doi],
    ["pmid", pmid],
    ["taal", taal]
  ].filter(([_, v]) => String(v || "").trim() !== "");

  const body = params
    .map(([k, v]) => ` | ${k} = ${v}`)
    .join("");

  return `<ref name="${refName}">{{Citeer journal${body} }}</ref>`;
}

  async function fetchCrossref(doi) {
    const endpoint = `https://api.crossref.org/works/${encodeURIComponent(doi)}`;
    const res = await fetch(endpoint, { headers: { "Accept": "application/json" } });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`Crossref error (${res.status}). ${text.slice(0, 200)}`);
    }
    const data = await res.json();
    if (!data?.message) throw new Error("Unexpected Crossref response.");
    return data.message;
  }

  const $doi = document.getElementById("doi");
  const $out = document.getElementById("out");
  const $status = document.getElementById("status");
  const $error = document.getElementById("error");
  const $copy = document.getElementById("copy");
  const $save = document.getElementById("save");
  const $library = document.getElementById("library");

let currentCitation = null;

  function setStatus(s) { $status.textContent = s || ""; }
  function setError(s) { $error.textContent = s || ""; }

  function getLibrary() {
  return JSON.parse(localStorage.getItem("wikiciteLibrary") || "[]");
}

function setLibrary(items) {
  localStorage.setItem("wikiciteLibrary", JSON.stringify(items));
}

function renderLibrary() {
  const items = getLibrary();

  if (items.length === 0) {
    $library.innerHTML = "No saved citations yet.";
    return;
  }

  $library.innerHTML = items.map((item, index) => `
    <div class="library-item">
      <div class="library-title">
        <strong>${item.author || "Unknown"} (${item.year || "n.d."})</strong> —
        <i>${abbreviateJournal(item.journal || "")}</i> —
        ${shortTitle(item.title || "")}
      </div>
      <div class="library-actions">
        <button onclick="copySavedCitation(${index})">⧉</button>
        <button onclick="deleteSavedCitation(${index})">✕</button>
      </div>
    </div>
  `).join("");
}

function shortTitle(title) {
  return String(title)
    .replace(/''(.*?)''/g, "$1")
    .split(/\s+/)
    .slice(0, 4)
    .join(" ");
}

async function copySavedCitation(index) {
  const item = getLibrary()[index];
  if (!item) return;

  try {
    await navigator.clipboard.writeText(item.wikicode);
    setStatus("Saved citation copied ✅");
    setTimeout(() => setStatus("Done."), 900);
  } catch {
    setError("Copy failed. Select and copy manually.");
  }
}

function deleteSavedCitation(index) {
  const items = getLibrary();
  items.splice(index, 1);
  setLibrary(items);
  renderLibrary();
}

function saveCurrentCitation() {
  if (!currentCitation) return;

  const items = getLibrary();

  // avoid saving exact duplicates
  if (items.some(item => item.doi === currentCitation.doi)) {
    setStatus("Already saved.");
    return;
  }

  items.unshift(currentCitation);
  setLibrary(items);
  renderLibrary();
  setStatus("Saved citation.");
}

function firstAuthorSurname(authors) {
  if (!Array.isArray(authors) || authors.length === 0) return "Unknown";

  const family = (authors[0].family || authors[0].name || "").trim();
  if (!family) return "Unknown";

  return toNormalCase(family);
}
  
  async function copyOutputToClipboard() {
  try {
    await navigator.clipboard.writeText($out.value);
    setStatus("Copied ✅");
    setTimeout(() => setStatus("Done."), 900);
  } catch {
    setError("Auto-copy failed. Select and copy manually.");
  }
}
  async function generate() {
    setError("");
    const doi = normalizeDOI($doi.value);
    if (!doi) { setError("Please enter a DOI"); return; }

    setStatus("Fetching metadata…");
    $out.value = "";
    $copy.disabled = true;

    try {
      const msg = await fetchCrossref(doi);
      setStatus("Generating wikicode…");
      $out.value = toWikicodeCiteJournal(msg, doi);
$copy.disabled = false;
$save.disabled = false;

currentCitation = {
  refName: refNameFromAuthors(msg.author, normalizeTitle(pickFirst(msg.title) || "")),
  author: firstAuthorSurname(msg.author),
  year: yearFrom(msg),
  journal: pickFirst(msg["container-title"]) || "",
  title: normalizeTitle(pickFirst(msg.title) || ""),
  doi: doi,
  wikicode: $out.value
};

      setStatus("Done.");
    } catch (e) {
      setStatus("");
      setError(String(e?.message || e));
    }
  }
  document.getElementById("save").addEventListener("click", saveCurrentCitation);
  
  document.getElementById("go").addEventListener("click", generate);
  $doi.addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });

 document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($out.value);
    setStatus("copied ✅");
    setTimeout(() => setStatus("done."), 900);
  } catch {
    setError("copy failed.");
  }
});

  document.getElementById("clear").addEventListener("click", () => {
    $doi.value = "";
    $out.value = "";
    setStatus("");
    setError("");
    $save.disabled = true;
    currentCitation = null;
    $copy.disabled = true;
    $doi.focus();
  });
  
  renderLibrary();
</script>
</body>
</html>
